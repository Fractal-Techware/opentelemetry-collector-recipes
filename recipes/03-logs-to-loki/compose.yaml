# OpenTelemetry Collector Recipes (free sample, MIT) - Fractal Techware
# Recipe 03 - Docker Compose
#   cp .env.example .env   # fill in the values
#   docker compose up -d && docker compose logs -f
# Hardened: non-root uid 10001, read-only root filesystem, no capabilities, ports on 127.0.0.1 only.
name: ftwotel-recipe-03

x-otelcol: &otelcol
  image: otel/opentelemetry-collector-contrib:0.161.0
  restart: unless-stopped
  user: "10001:10001"
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  mem_limit: 512m

services:
  otelcol:
    <<: *otelcol
    command: ["--config=/etc/otelcol/config.yaml"]
    environment:
      GOMEMLIMIT: 400MiB
      LOKI_OTLP_ENDPOINT: ${LOKI_OTLP_ENDPOINT:?set LOKI_OTLP_ENDPOINT in .env}
      LOKI_TENANT_ID: ${LOKI_TENANT_ID:-anonymous}
      LOG_SERVICE_NAME: ${LOG_SERVICE_NAME:-unknown_service}
      LOG_INCLUDE_GLOB: /var/log/app/*.log
      OTEL_STORAGE_DIR: /var/lib/otelcol/file_storage
    volumes:
      - ./config.yaml:/etc/otelcol/config.yaml:ro
      - ${APP_LOG_DIR:?set APP_LOG_DIR in .env}:/var/log/app:ro
      # Checkpoints must survive restarts. Create once: mkdir -p data && sudo chown 10001:10001 data
      - ./data:/var/lib/otelcol
